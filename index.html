<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Result Portal</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#e8f0ff,#f8fbff);
}
.container{
    width:90%;
    max-width:450px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
    text-align:center;
}
.logo{
    width:75px;height:75px;margin:auto;border-radius:50%;
    background:#1d4ed8;color:#fff;display:flex;
    align-items:center;justify-content:center;
    font-size:30px;font-weight:bold;
}
h1{margin-bottom:5px;color:#172554}
.subtitle{color:#64748b;margin-bottom:25px}
label{display:block;text-align:left;margin-bottom:8px;font-weight:bold;color:#334155}
input{
    width:100%;padding:13px;border:1px solid #cbd5e1;
    border-radius:9px;font-size:16px;outline:none;
}
input:focus{border-color:#2563eb}
button{
    width:100%;margin-top:18px;padding:13px;border:0;
    border-radius:9px;background:#2563eb;color:#fff;
    font-size:16px;font-weight:bold;cursor:pointer;
}
button:hover{background:#1d4ed8}
.result-card{
    margin-top:20px;background:#f0fdf4;
    border:1px solid #86efac;border-radius:12px;
    padding:20px;text-align:left;
}
.result-card h2{color:#166534;text-align:center}
.not-found{
    margin-top:20px;background:#fef2f2;
    border:1px solid #fecaca;color:#991b1b;
    padding:15px;border-radius:10px;
}
.footer{margin-top:25px;font-size:13px;color:#94a3b8}
</style>
</head>

<body>

<div class="container">

    <div class="logo">SR</div>

    <h1>Student Result</h1>

    <p class="subtitle">
        Enter your Roll Number to check your result
    </p>

    <form id="resultForm">

        <label for="roll">Roll Number</label>

        <input
            type="text"
            id="roll"
            placeholder="Enter Roll Number"
            autocomplete="off"
            required
        >

        <button type="submit">
            Check Result
        </button>

    </form>

    <div id="output"></div>

    <div class="footer">
        © 2026 Student Result Portal
    </div>

</div>


<script>

function checkResult() {

    var roll = document.getElementById("roll").value.trim();
    var output = document.getElementById("output");

    /*
       Student results are added here using if / else if.
       These are the same roll numbers you provided.
    */

    if (roll == "98938") {

        output.innerHTML = `
            <div class="result-card">
                <h2>Result Found</h2>
                <p><strong>Roll Number:</strong> 98938</p>
                 <p> Name : ANKIT YADAV</p>
                <p><strong>Marks:</strong> 75/75</p>
                <p><strong>Status:</strong> PASS</p>
            </div>
        `;

    }

    else if (roll == "75062") {

        output.innerHTML = `
            <div class="result-card">
                <h2>Result</h2>
                <p><strong>Roll Number:</strong> 75062</p>
                 <p> Name : DURYODHAN MAURYA</p>
                 <p><strong>Marks:</strong> 15/75</p>
                 <p><strong>fail:</strong> 
            
                
            </div>
        ;

    }

    else if (roll == "123457890") {

        output.innerHTML = `
            <div class="result-card">
                <h2>Result Found</h2>
                <p><strong>Name:</strong> Aman Yadav</p>
                <p><strong>Roll Number:</strong> 123457890</p>
                <p><strong>Marks:</strong> 75/75</p>
                <p><strong>Status:</strong> PASS</p>
            </div>
        `;

    }

    else {

        output.innerHTML = `
            <div class="not-found">
                <strong>Roll Number Not Found</strong>
                <br><br>
                Please check your Roll Number and try again.
            </div>
        `;

    }
}


document.getElementById("resultForm").addEventListener("submit", function(event) {

    event.preventDefault();

    checkResult();

});

</script>

</body>
</html>
